name: Mise a jour du registre de deprecation

on:
  schedule:
    - cron: "0 6 1,15 * *"  # Le 1er et 15 de chaque mois a 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Mettre a jour le registre depuis deprecations.info
        run: python -m src.update_registry
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}
          LLM_SCAN_ASSIGNEES: ${{ vars.LLM_SCAN_ASSIGNEES || '' }}

      - name: Detecter les changements du registre
        id: detect-changes
        run: |
          if git diff --quiet data/registry.json; then
            echo "Aucun changement dans le registre"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changements detectes dans le registre"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mettre a jour le README
        if: steps.detect-changes.outputs.changed == 'true'
        run: python -c "from src.update_registry import update_readme; from src.deprecations import load_registry; from pathlib import Path; update_readme(load_registry(), Path('README.md'))"
        env:
          PYTHONPATH: ${{ github.workspace }}

      - name: Pousser les changements sur une branche
        id: push-branch
        if: steps.detect-changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/update-registry-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Supprimer la branche distante si elle existe deja (re-execution le meme jour)
          git push origin --delete "$BRANCH" 2>/dev/null || true

          git checkout -b "$BRANCH"
          git add data/registry.json README.md
          git commit -m "chore: mise a jour du registre depuis deprecations.info"
          git push -u origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Ajuster les patterns regex avec Claude
        id: claude-validation
        if: steps.push-branch.outputs.branch != ''
        continue-on-error: true
        uses: anthropics/claude-code-action@ea36d6abdedc17fc2a671b36060770b208a6f8f1 # v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Le registre data/registry.json vient d'etre mis a jour avec de nouveaux
            modeles deprecies. Verifie que les patterns regex et les tests sont a jour.

            Notes importantes :
            - Les entrees du registre contenant des espaces sont des noms de categories
              (ex: "Chat model updates"), pas des model IDs. Elles sont ignorees par
              validate_patterns et le test de coherence. Ne cree PAS de patterns pour elles.
            - Les cles du registre sont en minuscules. Les patterns sont case-insensitive.

            1. Execute la validation des patterns :
               PYTHONPATH=. python -m src.validate_patterns --output-json
            2. Si des modeles ne sont pas couverts :
               a. Ajoute les patterns manquants dans src/patterns.py (respecte le style existant)
               b. Ajoute les cas de test BDD dans tests/features/patterns.feature
            3. Execute les tests :
               PYTHONPATH=. python -m pytest tests/ -v --rootdir=.
            4. Si des tests echouent :
               a. Corrige tests/features/deprecations.feature si des modeles ont change de
                  statut (ex: un modele "actif" est maintenant deprecie dans le registre)
               b. Corrige les autres tests BDD si necessaire
               c. Re-execute les tests jusqu'a ce qu'ils passent
            5. Execute le linter : ruff check src/ tests/ --fix && ruff format src/ tests/
            6. Si des changements ont ete faits, commit avec le message :
               "feat: update patterns and tests for new registry models"
            7. Si tout passe sans changement, ne fais rien.

          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python:*),Bash(pip:*),Bash(ruff:*),Bash(git:*),Bash(gh pr comment:*)"

      - name: Verifier le resultat de la validation Claude
        if: steps.push-branch.outputs.branch != '' && steps.claude-validation.outcome == 'failure'
        run: echo "::warning::La validation Claude a echoue. Verifier manuellement les patterns."

      - name: Creer la PR
        id: create-pr
        if: steps.push-branch.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --title "chore: mise a jour du registre de deprecation" \
            --body "Mise a jour automatique du registre et du README depuis [deprecations.info](https://deprecations.info/)." \
            --head "${{ steps.push-branch.outputs.branch }}" \
            --base main \
            --reviewer davebulaval
