name: Mise a jour du registre de deprecation

on:
  schedule:
    - cron: "0 6 * * 1"  # Chaque lundi a 06:00 UTC (filtre aux semaines paires)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Ignorer les semaines impaires (execution aux 2 semaines)
        if: github.event_name == 'schedule'
        run: |
          week=$(date +%V)
          if [ $((week % 2)) -ne 0 ]; then
            echo "Semaine impaire $week, on passe"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre a jour le registre depuis deprecations.info
        run: python -m src.update_registry
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}

      - name: Creer une PR si le registre a change
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet data/registry.json README.md && echo "Aucun changement" && exit 0

          BRANCH="chore/update-registry-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/registry.json README.md
          git commit -m "chore: mise a jour du registre depuis deprecations.info"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore: mise a jour du registre de deprecation" \
            --body "Mise a jour automatique du registre et du README depuis [deprecations.info](https://deprecations.info/)." \
            --head "$BRANCH" \
            --base main

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Ajuster les patterns regex avec Claude
        if: steps.create-pr.outputs.branch != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Le registre data/registry.json vient d'etre mis a jour avec de nouveaux
            modeles deprecies. Verifie si les patterns regex couvrent tous les modeles.

            1. Execute : PYTHONPATH=. python -m src.validate_patterns --output-json
            2. Si des modeles ne sont pas couverts :
               a. Ajoute les patterns manquants dans src/patterns.py (respecte le style existant)
               b. Ajoute les cas de test BDD dans tests/features/patterns.feature
               c. Execute les tests : PYTHONPATH=. python -m pytest tests/ -v --rootdir=.
               d. Execute le linter : ruff check src/ --fix && ruff format src/
               e. Commit les changements sur cette branche avec le message :
                  "feat: add regex patterns for new registry models"
            3. Si tous les modeles sont deja couverts, ne fais rien.

          claude_args: |
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(python:*),Bash(ruff:*),Bash(git:*),Bash(gh pr comment:*)"

      - name: Auto-merge la PR
        if: steps.create-pr.outputs.branch != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.branch }}" --squash --auto --delete-branch
