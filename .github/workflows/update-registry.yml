name: Mise a jour du registre de deprecation

on:
  schedule:
    - cron: "0 6 * * 1"  # Chaque lundi a 06:00 UTC (filtre aux semaines paires)
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Ignorer les semaines impaires (execution aux 2 semaines)
        if: github.event_name == 'schedule'
        run: |
          week=$(date +%V)
          if [ $((week % 2)) -ne 0 ]; then
            echo "Semaine impaire $week, on passe"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre a jour le registre depuis deprecations.info
        run: python -m src.update_registry
        env:
          PYTHONPATH: ${{ github.workspace }}
          GH_TOKEN: ${{ github.token }}

      - name: Creer une PR si le registre a change
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet data/registry.json README.md && echo "Aucun changement" && exit 0

          BRANCH="chore/update-registry-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/registry.json README.md
          git commit -m "chore: mise a jour du registre depuis deprecations.info"
          git push -u origin "$BRANCH"

          gh pr create \
            --title "chore: mise a jour du registre de deprecation" \
            --body "Mise a jour automatique du registre et du README depuis [deprecations.info](https://deprecations.info/)." \
            --head "$BRANCH" \
            --base main

          PR_URL=$(gh pr view "$BRANCH" --json url -q .url)
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"

          gh pr merge "$BRANCH" --squash --auto --delete-branch

      - name: Valider la couverture regex avec Claude
        if: steps.create-pr.outputs.pr-url != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Analyse les modeles dans data/registry.json.
            Pour chaque modele, verifie si les patterns regex dans src/patterns.py
            peuvent le detecter en executant :

              PYTHONPATH=. python -m src.validate_patterns --output-json

            Si des lacunes sont trouvees :
            1. Liste les modeles non couverts
            2. Suggere des patterns regex a ajouter dans src/patterns.py
            3. Suggere des cas de test BDD a ajouter dans tests/features/patterns.feature

            Poste un commentaire sur la PR avec les resultats.
          claude_args: |
            --allowedTools "Bash(python:*),Bash(gh pr comment:*),Read,Glob,Grep"
