name: "LLM Configuration Scanner"
description: "Scans a repository for deprecated LLM model references using regex pattern matching and creates GitHub issues. No AI/LLM API calls — purely static analysis."

inputs:
  repo-name:
    description: "Name of the repository being scanned"
    required: true
  assignees:
    description: "Comma-separated GitHub usernames to assign deprecation issues"
    required: false
    default: ""
  dry-run:
    description: "If true, scan only without creating issues"
    required: false
    default: "false"
  exclude-paths:
    description: >
      Motifs de chemins a exclure du scan, separes par des virgules ou des
      sauts de ligne. S'ajoutent au fichier .llm-scan-ignore du depot analyse,
      qui reste le moyen recommande : une exclusion versionnee dans le depot
      qu'elle concerne se relit avec lui, alors qu'une exclusion posee ici est
      invisible depuis le code qu'elle fait taire.
    required: false
    default: ""
  webhook-url:
    description: >
      Optional webhook URL to POST issue details for CRM integration. Pass it
      from a GitHub variable, not a secret: a destination URL is not a
      credential, and hiding it is what let the previous integration fail
      silently with a 403 nobody could diagnose.
    required: false
    default: ""
  webhook-token:
    description: "Bearer token for the webhook destination. This one is a secret."
    required: false
    default: ""

outputs:
  match-count:
    description: "Number of LLM model references found"
    value: ${{ steps.scan.outputs.match-count }}
  deprecated-count:
    description: "Number of deprecated model references found"
    value: ${{ steps.scan.outputs.deprecated-count }}
  issues-created:
    description: "Number of new GitHub issues created"
    value: ${{ steps.scan.outputs.issues-created }}
  deprecated-summary:
    description: "JSON summary of deprecated models found"
    value: ${{ steps.scan.outputs.deprecated-summary }}

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Run LLM scanner
      id: scan
      shell: bash
      env:
        SCAN_REPO_NAME: ${{ inputs.repo-name }}
        SCAN_PATH: ${{ github.workspace }}
        SCAN_ASSIGNEES: ${{ inputs.assignees }}
        SCAN_DRY_RUN: ${{ inputs.dry-run }}
        SCAN_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        SCAN_WEBHOOK_URL: ${{ inputs.webhook-url }}
        LLM_SCAN_WEBHOOK_TOKEN: ${{ inputs.webhook-token }}
        PYTHONPATH: ${{ github.action_path }}
        GH_TOKEN: ${{ github.token }}
      run: |
        ARGS=(--repo-name "$SCAN_REPO_NAME" --scan-path "$SCAN_PATH")

        if [ -n "$SCAN_ASSIGNEES" ]; then
          ARGS+=(--assignees "$SCAN_ASSIGNEES")
        fi

        if [ "$SCAN_DRY_RUN" = "true" ]; then
          ARGS+=(--dry-run)
        fi

        if [ -n "$SCAN_EXCLUDE_PATHS" ]; then
          ARGS+=(--exclude-paths "$SCAN_EXCLUDE_PATHS")
        fi

        if [ -n "$SCAN_WEBHOOK_URL" ]; then
          ARGS+=(--webhook-url "$SCAN_WEBHOOK_URL")
        fi

        python -m src.main "${ARGS[@]}"
